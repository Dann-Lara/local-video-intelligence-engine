# Local Video Intelligence Engine — configuracion por defecto
# Nada importante esta hardcodeado en el codigo (blueprint seccion 52).
#
# Cualquier valor puede sobreescribirse con una variable de entorno
# (ver .env.example) usando el prefijo LVI_.

project:
  name: local-video-intelligence
  schema_version: "1.0"

# --- Rutas (seccion 11) ---
# Rutas relativas se resuelven contra la raiz del proyecto.
# ESCAPE HATCH: si ffmpeg o remotion fallan por la ruta acentuada del
# proyecto, mueve *_root a una ruta ASCII, por ejemplo C:/lvi/work
paths:
  input_root: input
  output_root: output
  work_root: work
  logs_root: logs
  reports_root: reports
  database_dir: database
  config_dir: config
  prompts_dir: prompts
  schemas_dir: schemas
  remotion_dir: remotion

# --- LLM local (seccion 7) ---
llm:
  provider: lmstudio
  base_url: http://localhost:1234/v1
  # El blueprint indica 'google/gemma-3-4b', pero ese ID no existe en
  # LM Studio. Lo que hay instalado es gemma-3-4b-it-Q4_K_M.gguf.
  # 'auto' consulta GET {base_url}/models y elige el primer modelo cuyo
  # id contenga 'gemma'. Fijalo a un id concreto para reproducibilidad
  # (seccion 2.4 Determinismo).
  model: auto
  model_match: gemma
  temperature: 0.1
  max_tokens: 8192
  top_p: 0.95
  timeout_seconds: 600
  # Veces que se reintenta una respuesta invalida antes de marcar la etapa
  # como fallida (seccion 59).
  max_retries: 3
  # 'auto' prueba response_format=json_schema y degrada a JSON por prompt.
  structured_output: auto
  # Fases 3 y 4: el KV cache en f16 de Gemma 3 4B a 16k ocupa ~4.5 GB y no
  # cabe junto con los pesos en 8 GB de VRAM. Estos son parametros de LM
  # Studio, se aplican desde la app, no aqui; se documentan como referencia.
  lm_studio_recommended:
    context_length: 8192
    flash_attention: true
    kv_cache_quantization: q8_0
    gpu_offload_layers: -1

# --- Transcripcion (seccion 6) ---
whisper:
  provider: faster_whisper
  model: large-v3-turbo
  device: cuda
  compute_type: int8_float16
  language: auto          # 'auto' = deteccion
  beam_size: 5
  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 500
  word_timestamps: true
  condition_on_previous_text: false
  # Audio extraido para Whisper: 16 kHz mono PCM (seccion 12).
  audio_sample_rate: 16000
  audio_channels: 1
  # VRAM que hace falta para transcribir, en GB. Medido, no estimada:
  # scripts/measure_whisper_vram.py sobre 74 s de voz real en la RTX 3070 dio
  # 1.4 GB de pico (1.1 GB de pesos + ~0.3 GB de decoder), con y sin
  # word_timestamps. Aqui se piden 1.6 GB para no quedarse justo en el limite.
  # OJO: medir con SILENCIO da una cifra falsamente baja, porque el VAD
  # descarta los tramos mudos antes de decodificar y el pico nunca se reserva.
  vram_required_gb: 1.6

# --- Contexto (seccion 16) ---
context:
  level_1_min_seconds: 30
  level_1_max_seconds: 120
  level_2_min_seconds: 300
  level_2_max_seconds: 900

# --- Clips (seccion 23) ---
clips:
  minimum: 15
  preferred_minimum: 20
  preferred_maximum: 60
  maximum: 90
  # Silencio tolerado al PRINCIPIO del clip antes de anclar el corte a la
  # primera voz. Mas que esto y el clip arranca en un hueco, que es lo que hacia
  # que un clip de 38s passes el QC entero y fuera inservible.
  max_leading_silence: 1.5

# --- Seleccion (secciones 20, 21, 22) ---
selection:
  minimum_score: 72
  target_minimum: 3
  target_maximum: 10
  diversity_threshold: 0.80
  max_temporal_overlap: 0.5

# --- Salida (seccion 27) ---
output:
  width: 1080
  height: 1920
  fps: 30
  video_codec: h264_nvenc   # fallback: libx264 si nvenc no esta disponible
  crf: 20
  preset: p4
  pixel_format: yuv420p
  audio_codec: aac
  audio_bitrate: 192k
  audio_sample_rate: 48000
  container: mp4

# --- Crop (seccion 30) ---
crop:
  mode: center            # 'smart_vertical' en Fase 2, con deteccion de caras
  background: crop

# --- Render (secciones 27-29) ---
render:
  # Chrome/Edge que Remotion usa como navegador. Si es null se busca el del
  # sistema (Chrome o Edge en sus rutas habituales). Fijalo solo si tienes varios
  # instalados o si el automatico no encuentra ninguno. Escribirlo evita que
  # Remotion intente descargar su Chrome Headless Shell, que necesita red.
  browser_executable: null

# --- Subtitulos (seccion 31) ---
subtitles:
  enabled: true
  style: default
  max_words_per_line: 4
  max_lines: 2
  max_chars_per_line: 22
  min_duration_ms: 800
  max_duration_ms: 4000
  position: lower_center
  renderer: remotion      # 'ffmpeg_libass' para iterar rapido sin Remotion

# --- Audio (seccion 32) ---
audio:
  normalize: true
  target_lufs: -14.0
  true_peak_db: -1.5
  fade_in_seconds: 0.0
  fade_out_seconds: 0.15
  music_enabled: false    # nunca automatica: puede perjudicar la voz

# --- QC (seccion 33) ---
quality:
  technical_checks: true
  subtitle_checks: true
  semantic_qc: true
  minimum_semantic_score: 70
  duration_tolerance_seconds: 0.2
  max_render_size_bytes: 524288000

# --- Orquestacion (secciones 49, 50, 51) ---
orchestration:
  max_stage_retries: 2
  retry_backoff_seconds: 5
  checkpoint_enabled: true
  database_url: "sqlite:///database/local_video_intelligence.db"

# --- Logging (seccion 57) ---
logging:
  level: INFO
  format: json
  file: logs/pipeline.jsonl
  console_level: WARNING

# --- Rendimiento (secciones 41, 42) ---
performance:
  default_platform: youtube_shorts
  snapshot_ages_hours: [1, 6, 24, 48, 72, 168, 672]
  derived_metrics_version: "1.0"
  # Credenciales de YouTube Analytics API v2 (seccion 42).
  #
  # `access_token` NO se escribe aqui: es un token de OAuth con caducidad y
  # este fichero va al control de versiones. Va por entorno, con DOBLE guion
  # bajo entre niveles (el separador de la config, `__`):
  #   LVI_PERFORMANCE__YOUTUBE__ACCESS_TOKEN
  # Con un solo guion bajo NO funciona: se crea performance.youtube.access_token
  # literal como clave nueva y el override pasa desapercibido.
  # Se obtiene authorizing la cuenta con el scope yt-analytics.readonly.
  #
  # `channel_id` es opcional: si se deja a null la consulta usa
  # `channel==MINE`, que es lo normal cuando el token es de la cuenta propia.
  # Solo hace falta si hay varios canales y se quiere fijar uno.
  #
  # OJO: la granularidad de la API es el dia. Este adaptador declara
  # minimum_age_hours=24 y `sync` se salta los puntos de 1h y 6h en vez de
  # rellenarlos con un dato que en realidad mide 24 horas.
  youtube:
    channel_id: null
    access_token: null
    timeout_seconds: 30
