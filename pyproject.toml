[project]
name = "local-video-intelligence"
version = "0.1.0"
description = "Local AI video clipping and content intelligence engine"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "openai>=3.20.0",
    "pydantic>=2.13.5",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "httpx>=0.28.1",
    "tenacity>=9.1.4",
    "orjson>=3.12.0",
    "numpy>=2.5.3",
    "faster-whisper>=1.2.1",
    "pyloudnorm>=0.2.0",
    # Runtime de CUDA para ctranslate2 (seccion 73). El driver NVIDIA NO incluye
    # cuBLAS ni cuDNN: sin estas dos ruedas, faster-whisper con device=cuda
    # falla al decodificar el primer segmento con
    # "Library cublas64_12.dll is not found or cannot be loaded", aunque el
    # modelo cargue bien y `ctranslate2.get_cuda_device_count()` devuelva 1.
    # Son la alternativa ligera al CUDA Toolkit completo (~3 GB).
    # En Linux las trae ya el paquete de PyTorch y no hacen falta.
    "nvidia-cublas-cu12>=12.9.0; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9.26.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[project.scripts]
lvi = "main:main"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "slow: tests que tardan mas de un segundo o cargan un modelo de verdad",
    "cuda: tests que necesitan la GPU con el runtime de CUDA disponible",
    "llm: tests que necesitan LM Studio con un modelo cargado",
]

[tool.coverage.run]
source = ["src"]
